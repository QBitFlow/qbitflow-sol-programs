[package]
name = "qbitflow_payment_system"
version = "2.0.0"
description = "QBitFlow Payment System Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "qbitflow_payment_system"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
# anchor-lang = {version = "0.31.1", features = ["init-if-needed"]}
anchor-lang = {version = "1.0.2", features = ["init-if-needed"]}
anchor-spl = {version = "1.0.2", features = ["token", "token_2022", "token_2022_extensions"]}
# Anchor 1.0 slimmed its `solana_program` re-export; these modular crates now host
# hashv / the instructions sysvar helpers / the precompile program IDs.
solana-sha256-hasher = "3"
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"
log = "0.4.28"

