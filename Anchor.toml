[toolchain]
anchor_version = "1.0.2"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
qbitflow_payment_system = "C3geN9BD69RSjRmLX85NjpChzkoQKvNXHjTgSVDoV5xW"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id-test.json"

[scripts]
test = "node node_modules/mocha/bin/mocha.js --require ts-node/register -t 1000000 tests/**/*.ts"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[surfpool]
startup_wait = 5000
shutdown_wait = 2000
rpc_port = 8899
host = "127.0.0.1"
block_production_mode = "clock"
